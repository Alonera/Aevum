name: Build Linux

on:
  workflow_dispatch:        # manual "Run workflow" button
  push:
    tags: ['v*']            # also build + attach to a release on version tags

permissions:
  contents: write           # let the workflow create/update releases

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install flask pyinstaller

      - name: Fetch Linux yt-dlp + static ffmpeg
        run: |
          mkdir -p bin
          # The nightly channel, matching what the Windows build bundles.
          # Stable releases have come 25 to 84 days apart, and on 2026-08-16
          # the newest one was six weeks old and could not download from
          # YouTube at all. Shipping the Linux half from a different channel
          # would mean the two platforms fail on different days for different
          # reasons. What ships here is only the starting point: the in-app
          # updater watches both channels and moves to stable whenever stable
          # is the newer of the two.
          curl -L -o bin/yt-dlp https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp_linux
          chmod +x bin/yt-dlp
          curl -L -o ffmpeg.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          mkdir -p fftmp && tar -xf ffmpeg.tar.xz -C fftmp
          cp fftmp/ffmpeg-*-static/ffmpeg bin/ffmpeg
          # ffprobe rides along in the same tarball. yt-dlp reads metadata
          # through it, and without it --add-metadata gives up with
          # "ffprobe not found" on some sites. Same build as ffmpeg by
          # construction, which is the point of taking it from here.
          cp fftmp/ffmpeg-*-static/ffprobe bin/ffprobe
          chmod +x bin/ffmpeg bin/ffprobe
          # The URL above is a moving "latest release" pointer, so what
          # arrives has to be checked rather than trusted. The check is a
          # list of what is known to work, not a list of what is known to
          # break: refusing 8.1.x alone would have waved 9.x through on the
          # day upstream cut it, and 8.1's fault — HTTP range requests that
          # hang forever on googlevideo, killing clip downloads (yt-dlp
          # #16546) — is exactly the kind of thing a new major can bring
          # back. 7.x and 8.0.x are the versions this app has been tested
          # against. A refusal here is a build to look at, not a bug.
          ver=$(bin/ffmpeg -version | head -1 | awk '{print $3}')
          echo "bundled ffmpeg: $ver"
          # The version is not a bare number: builds carry their origin in
          # it. This repo's Windows copy says 8.0-essentials_build-www.gyan.dev
          # and a johnvansickle build says 7.0.2-static, so a pattern that
          # ends at the digits matches neither. 8.0* rather than 8.0.* for
          # that reason — the first attempt at this list would have failed the
          # build on 8.0, the very version the comment calls known-good.
          case "$ver" in
            7.*|8.0*) echo "ffmpeg $ver is a known-good version" ;;
            *) echo "REFUSING to bundle ffmpeg $ver - only 7.x and 8.0.x are tested"
               echo "(8.1.x hangs on googlevideo range requests; newer majors are unverified)"
               exit 1 ;;
          esac

      - name: Build AppImage + tar.gz
        run: |
          chmod +x build-linux.sh
          ./build-linux.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aevum-linux
          path: |
            Aevum-x86_64.AppImage
            Aevum-linux-x86_64.tar.gz

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Aevum-x86_64.AppImage
            Aevum-linux-x86_64.tar.gz
