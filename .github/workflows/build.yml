name: Build Linux

on:
  workflow_dispatch:        # manual "Run workflow" button
  push:
    tags: ['v*']            # also build + attach to a release on version tags

permissions:
  contents: write           # let the workflow create/update releases

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install flask pyinstaller

      - name: Fetch Linux yt-dlp + static ffmpeg
        run: |
          mkdir -p bin
          # The nightly channel, matching what the Windows build bundles.
          # Stable releases have come 25 to 84 days apart, and on 2026-08-16
          # the newest one was six weeks old and could not download from
          # YouTube at all. Shipping the Linux half from a different channel
          # would mean the two platforms fail on different days for different
          # reasons. What ships here is only the starting point: the in-app
          # updater watches both channels and moves to stable whenever stable
          # is the newer of the two.
          curl -L -o bin/yt-dlp https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp_linux
          chmod +x bin/yt-dlp
          # Static ffmpeg, pinned to a version line by the name of the file.
          # This used to come from johnvansickle.com through a "latest
          # release" pointer; on 2026-08-16 that host reset every connection,
          # from the runner and from a desktop alike, and took the release
          # build down with it. BtbN publishes the same kind of static GPL
          # build as a GitHub release asset — the same infrastructure the
          # rest of this workflow already depends on — and n7.1 in the name
          # means the version cannot wander off on its own. 7.x is a version
          # this app has been tested against; 8.1.x, which hangs forever on
          # googlevideo range requests (yt-dlp #16546), can never arrive
          # under this name.
          FF=ffmpeg-n7.1-latest-linux64-gpl-7.1
          curl -fL -o ffmpeg.tar.xz \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$FF.tar.xz"
          mkdir -p fftmp && tar -xf ffmpeg.tar.xz -C fftmp
          # Found rather than assumed: the two sources lay their archives out
          # differently, and a hard-coded path is how a swap like this breaks
          # quietly six months later.
          cp "$(find fftmp -type f -name ffmpeg | head -1)" bin/ffmpeg
          # ffprobe rides along in the same archive. yt-dlp reads metadata
          # through it, and without it --add-metadata gives up with
          # "ffprobe not found" on some sites. Same build as ffmpeg by
          # construction, which is the point of taking it from here.
          cp "$(find fftmp -type f -name ffprobe | head -1)" bin/ffprobe
          chmod +x bin/ffmpeg bin/ffprobe
          # The name pins the version line, but check what actually arrived
          # rather than trusting the label. A list of what is known to work,
          # not of what is known to break: refusing 8.1.x alone would wave
          # 9.x through on the day it is cut, and 8.1's fault — HTTP range
          # requests that hang forever on googlevideo, killing clip
          # downloads (yt-dlp #16546) — is exactly what a new major can
          # bring back. A refusal here is a build to look at, not a bug.
          ver=$(bin/ffmpeg -version | head -1 | awk '{print $3}')
          echo "bundled ffmpeg: $ver"
          # The version is not a bare number: builds carry their origin in
          # it. This repo's Windows copy says 8.0-essentials_build-www.gyan.dev
          # and a johnvansickle build says 7.0.2-static, so a pattern that
          # ends at the digits matches neither. 8.0* rather than 8.0.* for
          # that reason — the first attempt at this list would have failed the
          # build on 8.0, the very version the comment calls known-good.
          case "$ver" in
            7.*|8.0*) echo "ffmpeg $ver is a known-good version" ;;
            *) echo "REFUSING to bundle ffmpeg $ver - only 7.x and 8.0.x are tested"
               echo "(8.1.x hangs on googlevideo range requests; newer majors are unverified)"
               exit 1 ;;
          esac
          # A version number says nothing about what the build can encode,
          # and the app needs specific encoders: exact clip cuts re-encode
          # the section with x264 for mp4 and libvpx-vp9 with libopus for
          # webm. A build missing one of those fails at the moment a user
          # cuts a clip, in a place nothing here would have looked. Cheap to
          # ask now, especially with the source of these binaries changing.
          for enc in libx264 libvpx-vp9 libopus aac; do
            bin/ffmpeg -hide_banner -encoders 2>/dev/null | grep -q " $enc " \
              || { echo "REFUSING: bundled ffmpeg has no $enc encoder"; exit 1; }
          done
          echo "encoders present: libx264, libvpx-vp9, libopus, aac"
          bin/ffprobe -version | head -1

      - name: Build AppImage + tar.gz
        run: |
          chmod +x build-linux.sh
          ./build-linux.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aevum-linux
          path: |
            Aevum-x86_64.AppImage
            Aevum-linux-x86_64.tar.gz

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Aevum-x86_64.AppImage
            Aevum-linux-x86_64.tar.gz
